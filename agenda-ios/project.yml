name: AgendaNative
options:
  bundleIdPrefix: com.drruvari
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  AgendaNative:
    type: application
    platform: iOS
    sources:
      - Agenda
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.drruvari.agenda
        PRODUCT_NAME: Agenda
        PRODUCT_MODULE_NAME: AgendaNative
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Agenda
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSFaceIDUsageDescription: Allow Agenda to unlock your private agenda.
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: Allow Agenda to show and add events from your calendars.
        INFOPLIST_KEY_NSContactsUsageDescription: Allow Agenda to show birthdays from your contacts.
        CODE_SIGN_ENTITLEMENTS: Agenda/Agenda.entitlements
    dependencies:
      - sdk: libsqlite3.tbd
      - target: AgendaWidget
        embed: true
  AgendaWidget:
    type: app-extension
    platform: iOS
    sources:
      - AgendaWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.drruvari.agenda.widgets
        PRODUCT_NAME: AgendaWidget
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: AgendaWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: AgendaWidget/AgendaWidget.entitlements
        SKIP_INSTALL: YES
  AgendaNativeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AgendaTests
    dependencies:
      - target: AgendaNative
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Agenda.app/Agenda"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  AgendaNative:
    build:
      targets:
        AgendaNative: all
        AgendaNativeTests: [test]
    test:
      targets:
        - AgendaNativeTests
